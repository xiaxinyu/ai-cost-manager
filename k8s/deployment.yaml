# 一键部署：kubectl apply -f k8s/deployment.yaml
# Secret 中 COST_MGMT_SESSION_SECRET_KEY 部署前须替换为强随机值。
---
apiVersion: v1
kind: Namespace
metadata:
  name: hds-aswatson-prd
  labels:
    app.kubernetes.io/name: ai-cost-manager
---
# SQLite 与 bills 共用一块盘；storageClassName 请按集群改为实际 StorageClass（留空则使用默认）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-cost-manager-data
  namespace: hds-aswatson-prd
  labels:
    app.kubernetes.io/name: ai-cost-manager
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: standard
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-cost-manager-config
  namespace: hds-aswatson-prd
  labels:
    app.kubernetes.io/name: ai-cost-manager
data:
  # 与下方 PVC 挂载路径一致（单卷 /srv）
  COST_MGMT_DB_PATH: "/srv/data/cost_mgmt.sqlite3"
  BILLS_DIR_PATH: "/srv/bills"
  COST_MGMT_AUTH_ENABLED: "1"
  COST_MGMT_COOKIE_SECURE: "1"
  AUTO_INGEST: "0"
---
# 也可用: kubectl -n hds-aswatson-prd create secret generic ai-cost-manager-secrets \
#   --from-literal=COST_MGMT_SESSION_SECRET_KEY="$(openssl rand -base64 48)" --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: ai-cost-manager-secrets
  namespace: hds-aswatson-prd
  labels:
    app.kubernetes.io/name: ai-cost-manager
type: Opaque
stringData:
  COST_MGMT_SESSION_SECRET_KEY: "REPLACE_ME_BEFORE_APPLY"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-cost-manager
  namespace: hds-aswatson-prd
  labels:
    app.kubernetes.io/name: ai-cost-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-cost-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-cost-manager
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: ensure-dirs
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /srv/data /srv/bills"]
          volumeMounts:
            - name: data
              mountPath: /srv
      containers:
        - name: web
          image: your-registry/ai-cost-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ai-cost-manager-config
          env:
            - name: COST_MGMT_SESSION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-cost-manager-secrets
                  key: COST_MGMT_SESSION_SECRET_KEY
          volumeMounts:
            - name: data
              mountPath: /srv
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ai-cost-manager-data
---
apiVersion: v1
kind: Service
metadata:
  name: ai-cost-manager
  namespace: hds-aswatson-prd
  labels:
    app.kubernetes.io/name: ai-cost-manager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-cost-manager
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# 按环境修改 host、ingressClassName、TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-cost-manager
  namespace: hds-aswatson-prd
  labels:
    app.kubernetes.io/name: ai-cost-manager
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  ingressClassName: nginx
  rules:
    - host: ai-cost-manager.hds-aswatson-prd.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-cost-manager
                port:
                  name: http
  # tls:
  #   - hosts:
  #       - ai-cost-manager.hds-aswatson-prd.example.com
  #     secretName: ai-cost-manager-tls
